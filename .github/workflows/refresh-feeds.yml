name: Refresh AI Ethics Live Feeds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch authoritative RSS & arXiv feeds
        run: node scripts/update_live_feeds.mjs

      - name: Commit updated live-feed.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/live-feed.json; then
            git add data/live-feed.json
            git commit -m "chore(feeds): automated 6h refresh of live-feed.json"
            git push
          else
            echo "No feed changes detected."
          fi
